<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121212" />
    <title>Quick Math Offline Game</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <main class="game-card">
      <h1>Quick Math Offline Game</h1>
      <p class="subtitle">Answer before time runs out!</p>

      <section class="runner-scene" aria-hidden="true">
        <div class="sky-line"></div>
        <div id="runner" class="runner">🦖</div>
        <div class="obstacle obstacle-1">🌵</div>
        <div class="obstacle obstacle-2">🌵</div>
        <div class="ground-track"></div>
      </section>

      <section class="status-row" aria-live="polite">
        <div><span class="label">Score</span><span id="score">0</span></div>
        <div><span class="label">Time</span><span id="time">10</span>s</div>
      </section>

      <section class="question-box" id="question-box">
        <p class="label">Question</p>
        <p id="question" class="question-text">Loading...</p>
      </section>

      <form id="answer-form" autocomplete="off">
        <label for="answer" class="label">Your Answer</label>
        <input id="answer" name="answer" inputmode="numeric" required />
        <button type="submit">Submit</button>
      </form>

      <p id="message" class="message" aria-live="polite"></p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
